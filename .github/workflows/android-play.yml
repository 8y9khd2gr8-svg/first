# Play kapalı test paketi (AAB): GitHub'da "Actions → Play kapalı test paketi → Run workflow" ile
# elle çalıştırılır. Bitince sayfanın altındaki "zip-zip-dunya-play" dosyası indirilir ve
# Play Console'da kapalı teste yüklenir (adımlar: docs/magaza-rehberi.md, 3b).
# Yükleme anahtarı depoda kilitli durur (android/yukleme-anahtari.jks.enc); kilidi açan parola
# sadece GitHub'daki gizli değerdedir (PLAY_ANAHTAR_PAROLASI). Açılmış anahtar depoya hiç girmez.
name: Play kapalı test paketi

on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Parola eklenmiş mi?
        env:
          PAROLA: ${{ secrets.PLAY_ANAHTAR_PAROLASI }}
        run: |
          if [ -z "$PAROLA" ]; then
            echo "::error::Parola eksik. Settings → Secrets and variables → Actions'a PLAY_ANAHTAR_PAROLASI ekleyin (docs/magaza-rehberi.md, 3b)."
            exit 1
          fi
      - run: npm ci
      - run: npm run magaza
      - name: Anahtarın kilidini geçici dosyaya aç
        env:
          PAROLA: ${{ secrets.PLAY_ANAHTAR_PAROLASI }}
        run: |
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android/yukleme-anahtari.jks.enc -out "$RUNNER_TEMP/yukleme.jks" -pass env:PAROLA; then
            echo "::error::Parola yanlış. PLAY_ANAHTAR_PAROLASI değerini silip yeniden ekleyin (başında/sonunda boşluk olmasın)."
            exit 1
          fi
      - name: İmzalı paket (AAB)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yukleme.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PLAY_ANAHTAR_PAROLASI }}
          ANDROID_KEY_ALIAS: zipzip
          # Her çalıştırmada artar (Play aynı sürüm kodunu ikinci kez kabul etmez).
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          export ANDROID_VERSION_NAME=$(node -p "require('./package.json').version")
          cd android && ./gradlew bundleRelease
      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/yukleme.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: zip-zip-dunya-play
          path: android/app/build/outputs/bundle/release/app-release.aab
