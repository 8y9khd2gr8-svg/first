# Android deneme paketi (APK): GitHub'da "Actions → Android deneme paketi → Run workflow" ile
# elle çalıştırılır. Bitince sayfanın altındaki "zip-zip-dunya-apk" dosyası indirilip
# Android telefona kurulabilir (mağazaya gönderilmez; sadece deneme içindir).
name: Android deneme paketi

on:
  workflow_dispatch:
    inputs:
      internetsiz:
        description: 'İnternet izni olmadan üret (gizlilik denemesi: oyun izinsiz de açılıyor mu?)'
        type: boolean
        default: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run magaza
      # Deneme: internet izni kaldırılır. Oyun böyle de açılıyorsa Play sayfasında "internet erişimi yok" görünebilir.
      - if: inputs.internetsiz
        run: |
          sed -i '/android.permission.INTERNET/d' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.internetsiz && 'zip-zip-dunya-apk-internetsiz' || 'zip-zip-dunya-apk' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
