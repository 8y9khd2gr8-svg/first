# iPhone paketi derleniyor mu? İmzasız derler (Apple hesabı ve sertifika gerekmez); telefona
# kurulacak bir dosya üretmez, sadece iPhone tarafında bir şeyin bozulmadığını denetler.
# iPhone'u ilgilendiren dosyalar değişince PR'da kendiliğinden, istenirse Actions'tan elle çalışır.
name: iPhone derleme denetimi

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-derleme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Oyunu derle ve iPhone projesine aktar
        run: npm run build && npx cap sync ios
      - name: İmzasız iPhone derlemesi
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derleme" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Uygulama paketi oluştu mu?
        run: test -d "$RUNNER_TEMP/derleme/Build/Products/Release-iphoneos/App.app" && du -sh "$RUNNER_TEMP/derleme/Build/Products/Release-iphoneos/App.app"
